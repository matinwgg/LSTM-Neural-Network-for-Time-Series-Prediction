name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "pytest>=8" \
            "flake8>=7" "bandit>=1.7"
      - name: Tests
        run: pytest
      - name: Critical lint
        run: |
          flake8 core tests run.py --count --select=E9,F63,F7,F82 \
            --show-source --statistics
      - name: Security scan
        run: bandit -q -ll -r core run.py
